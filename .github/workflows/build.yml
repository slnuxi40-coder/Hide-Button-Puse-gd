name: Build Geode Mod (Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          set -e
          mkdir -p geode-cli-pkg
          ASSET_URL=$(curl -sL https://api.github.com/repos/geode-sdk/cli/releases/latest \
            | grep -oE '"browser_download_url":[[:space:]]*"[^"]+"' \
            | cut -d'"' -f4 \
            | grep -iE 'linux' \
            | head -n 1)
          echo "Downloading: $ASSET_URL"
          curl -sL "$ASSET_URL" -o geode-cli-pkg/cli_archive
          if file geode-cli-pkg/cli_archive | grep -qi 'gzip'; then
            tar -xzf geode-cli-pkg/cli_archive -C geode-cli-pkg
          elif file geode-cli-pkg/cli_archive | grep -qi 'zip'; then
            unzip -o geode-cli-pkg/cli_archive -d geode-cli-pkg
          else
            chmod +x geode-cli-pkg/cli_archive
            sudo mv geode-cli-pkg/cli_archive /usr/local/bin/geode
          fi
          if [ ! -f /usr/local/bin/geode ]; then
            BIN_PATH=$(find geode-cli-pkg -name "geode" -type f | head -n 1)
            sudo mv "$BIN_PATH" /usr/local/bin/geode
            sudo chmod +x /usr/local/bin/geode
          fi
          geode --version

      - name: Build for Android
        run: |
          geode build --platform android

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: hide-pause-button-android
          path: build/*.geode
